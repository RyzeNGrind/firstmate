# audit/criteria/nexverse.yaml
# Independent audit criteria for NexVerse Arcade — T2 SoW V5-T2-2025-11-18
# Source of truth: construction-aligned.yaml SoW, NOT the builder's signoff reports.
# Every criterion carries a command: field; criteria without a command are opinions, not criteria.
# Commands exit 0 = PASS, exit 2 = SKIP/BLOCKED, any other non-zero = FAIL.

client: nexverse
sow_version: V5-T2-2025-11-18
live_url: https://nexverse.dasagency.ca
repo: das-grp/client-t2m1-landing
github_remote: https://github.com/RyzeNGrind/client-t2m1-landing.git

milestones:
  M1:
    name: "Foundation & Pre-Launch Marketing Infrastructure"
    amount_cad: 1125.00
    sow_trigger: "M1 kickoff / project commencement"
    criteria:
      - id: m1-repo-accessible
        description: "GitHub repo RyzeNGrind/client-t2m1-landing is reachable and has a HEAD commit"
        command: "git ls-remote https://github.com/RyzeNGrind/client-t2m1-landing.git HEAD 2>&1 | grep -qE '[0-9a-f]{40}'"

      - id: m1-release-tag
        description: "A release/nv-t2m1-landing/M1-* tag exists in GitHub (formal M1 delivery marker)"
        command: |
          api=$(curl -s -o /dev/null -w '%{http_code}' 'https://api.github.com/repos/RyzeNGrind/client-t2m1-landing' -H 'User-Agent: audit/1.0' 2>/dev/null)
          if [ "$api" != "200" ]; then
            echo "SKIP: GitHub repo not publicly accessible (HTTP $api) — re-run with repo read access"
            exit 2
          fi
          result=$(GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/RyzeNGrind/client-t2m1-landing.git 'refs/tags/release/nv-t2m1-landing/M1-*' 2>&1)
          echo "$result"
          echo "$result" | grep -q 'refs/tags'

      - id: m1-main-branch
        description: "main branch exists in GitHub repo (site deployment branch)"
        command: |
          api=$(curl -s -o /dev/null -w '%{http_code}' 'https://api.github.com/repos/RyzeNGrind/client-t2m1-landing' -H 'User-Agent: audit/1.0' 2>/dev/null)
          if [ "$api" != "200" ]; then
            echo "SKIP: GitHub repo not publicly accessible (HTTP $api) — re-run with repo read access"
            exit 2
          fi
          result=$(GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/RyzeNGrind/client-t2m1-landing.git refs/heads/main 2>&1)
          echo "$result"
          echo "$result" | grep -qE '[0-9a-f]{40}'

      - id: m1-app-directory
        description: "src/app directory exists in repo — confirms 7-page framework was scaffolded"
        command: "curl -sf 'https://api.github.com/repos/RyzeNGrind/client-t2m1-landing/contents/src/app' -H 'User-Agent: audit/1.0' -o /dev/null -w '%{http_code}' | grep -q '^200$'"

      - id: m1-homepage-file
        description: "src/app/page.tsx (root homepage) exists in repo"
        command: "curl -sf 'https://api.github.com/repos/RyzeNGrind/client-t2m1-landing/contents/src/app/page.tsx' -H 'User-Agent: audit/1.0' -o /dev/null -w '%{http_code}' | grep -q '^200$'"

      - id: m1-package-json
        description: "package.json exists — confirms project was initialised as an npm/node project"
        command: "curl -sf 'https://api.github.com/repos/RyzeNGrind/client-t2m1-landing/contents/package.json' -H 'User-Agent: audit/1.0' -o /dev/null -w '%{http_code}' | grep -q '^200$'"

  M2:
    name: "Database Architecture Investigation"
    amount_cad: 1125.00
    sow_trigger: "M2 kickoff / DB architecture start"
    criteria:
      - id: m2-release-tag
        description: "A release/nv-t2m1-landing/M2-* tag exists in GitHub (formal M2 delivery marker)"
        command: |
          api=$(curl -s -o /dev/null -w '%{http_code}' 'https://api.github.com/repos/RyzeNGrind/client-t2m1-landing' -H 'User-Agent: audit/1.0' 2>/dev/null)
          if [ "$api" != "200" ]; then
            echo "SKIP: GitHub repo not publicly accessible (HTTP $api) — re-run with repo read access"
            exit 2
          fi
          result=$(GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/RyzeNGrind/client-t2m1-landing.git 'refs/tags/release/nv-t2m1-landing/M2-*' 2>&1)
          echo "$result"
          echo "$result" | grep -q 'refs/tags'

      - id: m2-auth-route-exists
        description: "Authentication-related file or directory exists in repo (user registration/login scope)"
        command: |
          curl -sf 'https://api.github.com/repos/RyzeNGrind/client-t2m1-landing/git/trees/HEAD?recursive=1' \
            -H 'User-Agent: audit/1.0' 2>/dev/null | \
          python3 -c "
          import json, sys, re
          tree = json.load(sys.stdin).get('tree', [])
          auth_paths = [x['path'] for x in tree if re.search(r'(auth|login|signin|signup)', x['path'], re.I)]
          print('Found', len(auth_paths), 'auth-related paths')
          print('\n'.join(auth_paths[:8]))
          sys.exit(0 if auth_paths else 1)
          "

      - id: m2-db-env-template
        description: "DATABASE_URL is referenced in the repo (confirms DB architecture was implemented)"
        command: |
          curl -sf 'https://api.github.com/repos/RyzeNGrind/client-t2m1-landing/git/trees/HEAD?recursive=1' \
            -H 'User-Agent: audit/1.0' 2>/dev/null | \
          python3 -c "
          import json, sys
          tree = json.load(sys.stdin).get('tree', [])
          env_files = [x['path'] for x in tree if '.env' in x['path'].lower() or x['path'].endswith('env.example')]
          print('Found env files:', env_files)
          sys.exit(0 if env_files else 1)
          "

      - id: m2-signup-page-exists
        description: "User signup/registration page exists in repo (SoW: user registration system)"
        command: |
          curl -sf 'https://api.github.com/repos/RyzeNGrind/client-t2m1-landing/git/trees/HEAD?recursive=1' \
            -H 'User-Agent: audit/1.0' 2>/dev/null | \
          python3 -c "
          import json, sys, re
          tree = json.load(sys.stdin).get('tree', [])
          pages = [x['path'] for x in tree if re.search(r'(signup|register)', x['path'], re.I)]
          print('Found signup/register paths:', pages)
          sys.exit(0 if pages else 1)
          "

  M3:
    name: "Core Backend Development & Soft Launch Preparation"
    amount_cad: 1350.00
    sow_trigger: "Soft launch of physical location OR end of Month 4, whichever comes first"
    notes: >
      Live surface: nexverse.dasagency.ca.
      Release tags: release/nv-t2m1-landing/M3-20260708123957-059c060 (signoff 2026-07-08)
      and release/nv-t2m1-landing/20260829T230921Z-01f25c3 (post-walkthrough 2026-08-29).
      Builder-reported test count: 43 vitest tests in __tests__/m3-*.spec.ts.
    criteria:
      - id: m3-http-root
        description: "Homepage / returns HTTP 200"
        command: |
          code=$(curl -sf -o /dev/null --max-redirs 5 -L -w '%{http_code}' https://nexverse.dasagency.ca/ 2>/dev/null)
          echo "HTTP $code"
          [ "$code" = "200" ]

      - id: m3-http-booking
        description: "/booking page returns HTTP 200"
        command: |
          code=$(curl -sf -o /dev/null --max-redirs 5 -L -w '%{http_code}' https://nexverse.dasagency.ca/booking 2>/dev/null)
          echo "HTTP $code"
          [ "$code" = "200" ]

      - id: m3-http-tournaments
        description: "/tournaments page returns HTTP 200"
        command: |
          code=$(curl -sf -o /dev/null --max-redirs 5 -L -w '%{http_code}' https://nexverse.dasagency.ca/tournaments 2>/dev/null)
          echo "HTTP $code"
          [ "$code" = "200" ]

      - id: m3-http-account
        description: "/account page accessible (200 direct or redirect to login then 200)"
        command: |
          code=$(curl -sf -o /dev/null --max-redirs 5 -L -w '%{http_code}' https://nexverse.dasagency.ca/account 2>/dev/null)
          echo "HTTP $code"
          [ "$code" = "200" ]

      - id: m3-http-privacy
        description: "/privacy page returns HTTP 200"
        command: |
          code=$(curl -sf -o /dev/null --max-redirs 5 -L -w '%{http_code}' https://nexverse.dasagency.ca/privacy 2>/dev/null)
          echo "HTTP $code"
          [ "$code" = "200" ]

      - id: m3-http-terms
        description: "/terms page returns HTTP 200"
        command: |
          code=$(curl -sf -o /dev/null --max-redirs 5 -L -w '%{http_code}' https://nexverse.dasagency.ca/terms 2>/dev/null)
          echo "HTTP $code"
          [ "$code" = "200" ]

      - id: m3-http-admin
        description: "/admin page accessible (200 direct or redirect to login then 200)"
        command: |
          code=$(curl -sf -o /dev/null --max-redirs 5 -L -w '%{http_code}' https://nexverse.dasagency.ca/admin 2>/dev/null)
          echo "HTTP $code"
          [ "$code" = "200" ]

      - id: m3-content-brand
        description: "Homepage contains the brand name 'NexVerse'"
        command: "curl -sL https://nexverse.dasagency.ca/ | grep -qi 'NexVerse'"

      - id: m3-content-booking
        description: "/booking page contains booking-related UI text"
        command: "curl -sL https://nexverse.dasagency.ca/booking | grep -qiE '(book|reserv|party|session)'"

      - id: m3-content-privacy
        description: "/privacy page contains 'Privacy Policy' text"
        command: "curl -sL https://nexverse.dasagency.ca/privacy | grep -qi 'Privacy Policy'"

      - id: m3-content-terms
        description: "/terms page contains 'Terms' heading text"
        command: "curl -sL https://nexverse.dasagency.ca/terms | grep -qi 'Terms'"

      - id: m3-meta-viewport
        description: "Homepage has a mobile viewport meta tag (SoW: mobile-responsive design)"
        command: "curl -sL https://nexverse.dasagency.ca/ | grep -qi 'name=\"viewport\"'"

      - id: m3-release-tag-m3
        description: "M3 release tag release/nv-t2m1-landing/M3-20260708123957-059c060 exists in GitHub"
        command: |
          api=$(curl -s -o /dev/null -w '%{http_code}' 'https://api.github.com/repos/RyzeNGrind/client-t2m1-landing' -H 'User-Agent: audit/1.0' 2>/dev/null)
          if [ "$api" != "200" ]; then
            echo "SKIP: GitHub repo RyzeNGrind/client-t2m1-landing not publicly accessible (HTTP $api) — auditor needs read access or a GH_TOKEN"
            exit 2
          fi
          result=$(GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/RyzeNGrind/client-t2m1-landing.git 'refs/tags/release/nv-t2m1-landing/M3-20260708123957-059c060' 2>&1)
          echo "$result"
          echo "$result" | grep -q 'refs/tags'

      - id: m3-release-tag-walkthrough
        description: "Post-walkthrough tag release/nv-t2m1-landing/20260829T230921Z-01f25c3 exists in GitHub"
        command: |
          api=$(curl -s -o /dev/null -w '%{http_code}' 'https://api.github.com/repos/RyzeNGrind/client-t2m1-landing' -H 'User-Agent: audit/1.0' 2>/dev/null)
          if [ "$api" != "200" ]; then
            echo "SKIP: GitHub repo RyzeNGrind/client-t2m1-landing not publicly accessible (HTTP $api) — auditor needs read access or a GH_TOKEN"
            exit 2
          fi
          result=$(GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/RyzeNGrind/client-t2m1-landing.git 'refs/tags/release/nv-t2m1-landing/20260829T230921Z-01f25c3' 2>&1)
          echo "$result"
          echo "$result" | grep -q 'refs/tags'

      - id: m3-test-files-exist
        description: "m3-*.spec.ts test files present at M3 tag (signoff states 3 spec files)"
        command: |
          curl -sf "https://api.github.com/repos/RyzeNGrind/client-t2m1-landing/contents/__tests__?ref=release%2Fnv-t2m1-landing%2FM3-20260708123957-059c060" \
            -H 'User-Agent: audit/1.0' 2>/dev/null | \
          python3 -c "
          import json, sys, re
          try:
              items = json.load(sys.stdin)
              m3 = [x['name'] for x in items if re.match(r'm3-.*\.spec\.ts', x.get('name',''))]
              print('m3 spec files at M3 tag:', m3)
              sys.exit(0 if len(m3) >= 1 else 1)
          except Exception as e:
              print('SKIP: could not fetch test listing:', e, file=sys.stderr)
              sys.exit(2)
          "

      - id: m3-test-count-43
        description: "m3-*.spec.ts test suite at M3 tag contains exactly 43 tests (per signoff)"
        command: |
          python3 -c "
          import urllib.request, json, re, sys
          headers = {'User-Agent': 'audit/1.0'}
          base = 'https://api.github.com/repos/RyzeNGrind/client-t2m1-landing'
          ref = 'release%2Fnv-t2m1-landing%2FM3-20260708123957-059c060'
          def fetch_json(url):
              req = urllib.request.Request(url, headers=headers)
              return json.loads(urllib.request.urlopen(req, timeout=30).read())
          try:
              items = fetch_json(f'{base}/contents/__tests__?ref={ref}')
              m3 = [x for x in items if re.match(r'm3-.*\.spec\.ts', x.get('name',''))]
              count = 0
              for f in m3:
                  raw = urllib.request.Request(f['download_url'], headers=headers)
                  content = urllib.request.urlopen(raw, timeout=30).read().decode()
                  found = len(re.findall(r'^\s*(it|test)\s*\(', content, re.MULTILINE))
                  print(f['name'], '->', found, 'tests')
                  count += found
              print(f'Total: {len(m3)} files, {count} tests (expected: 43)')
              sys.exit(0 if count == 43 else 1)
          except Exception as e:
              print('SKIP:', e, file=sys.stderr)
              sys.exit(2)
          "

  M4:
    name: "Post-Launch: Final Testing & Public Launch"
    amount_cad: 900.00
    sow_trigger: "Completion of public hard launch and final deployment"
    notes: >
      M4 has not been invoiced yet as of 2026-09-26.
      Criteria marked BLOCKED require client-provided credentials or actions not yet taken.
      Run this audit again when M4 is kicked off.
    criteria:
      - id: m4-square-code-present
        description: "Square payment integration code exists in repo (SoW: payment processor integration)"
        command: |
          curl -sf 'https://api.github.com/repos/RyzeNGrind/client-t2m1-landing/git/trees/HEAD?recursive=1' \
            -H 'User-Agent: audit/1.0' 2>/dev/null | \
          python3 -c "
          import json, sys, re
          tree = json.load(sys.stdin).get('tree', [])
          sq = [x['path'] for x in tree if re.search(r'square', x['path'], re.I)]
          print('Square-related paths:', sq)
          sys.exit(0 if sq else 1)
          "

      - id: m4-square-live
        description: "Square payment integration is active with production credentials (M4 go-live gate)"
        command: "echo 'BLOCKED: Square production credentials not yet provided by client — activates in M4 kickoff'; exit 2"

      - id: m4-lighthouse-score
        description: "Lighthouse performance score >= 90 on homepage (SoW: Full E2E QA + Lighthouse >= 90)"
        command: "echo 'BLOCKED: Lighthouse requires a headless Chrome installation — run: npx lighthouse https://nexverse.dasagency.ca --only-categories=performance --output=json | jq .categories.performance.score'; exit 2"

      - id: m4-production-domain
        description: "nexversearcade.com resolves and serves the NexVerse site (SoW: production domain)"
        command: |
          code=$(curl -sf -o /dev/null --max-redirs 5 -L -w '%{http_code}' https://nexversearcade.com/ 2>/dev/null || echo '000')
          echo "HTTP status for nexversearcade.com: $code"
          echo "$code" | grep -qE '^(200|301|302|308)$' || { echo 'BLOCKED: domain not yet pointed at production deployment'; exit 2; }

      - id: m4-handover-docs
        description: "Client handover documentation exists in repo (SoW: handoff of all documentation)"
        command: |
          curl -sf 'https://api.github.com/repos/RyzeNGrind/client-t2m1-landing/contents/docs/engagement' \
            -H 'User-Agent: audit/1.0' -o /dev/null -w '%{http_code}' | grep -q '^200$'
